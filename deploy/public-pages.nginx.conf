# Standalone static host, or adapt these locations into the existing website.
# Copy the approved package into /usr/share/nginx/html before deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location = /privacy { return 308 /privacy/; }
    location = /privacy-policy { return 308 /privacy/; }
    location = /privacy-policy/ { return 308 /privacy/; }
    location = /terms { return 308 /terms/; }
    location = /support { return 308 /support/; }
    location / { try_files $uri $uri/ =404; }
}
