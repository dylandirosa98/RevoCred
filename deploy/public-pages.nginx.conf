# Optional standalone static host for the legal pages (the API already serves
# them at api.revocred.com). Export with `go run ./cmd/legalpages -out DIR`
# from revocred-api/ and copy DIR into /usr/share/nginx/html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location = /privacy { return 308 /privacy/; }
    location = /privacy-policy { return 308 /privacy/; }
    location = /privacy-policy/ { return 308 /privacy/; }
    location = /terms { return 308 /terms/; }
    location = /terms-of-use { return 308 /terms/; }
    location = /legal { return 308 /; }
    location = /support { return 308 /support/; }
    location / { try_files $uri $uri/ =404; }
}
