<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Know which credit card to use at checkout and plan your next card strategy with RevoCred.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F3">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0C11">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RevoCred">
  <meta property="og:title" content="RevoCred | Credit-Card Strategy &amp; Rewards">
  <meta property="og:description" content="Know which credit card to use at checkout and plan your next card strategy with RevoCred.">
  <meta property="og:url" content="https://app.revocred.com/">
  <meta property="og:image" content="https://app.revocred.com/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="RevoCred | Credit-Card Strategy &amp; Rewards">
  <meta name="twitter:description" content="Know which credit card to use at checkout and plan your next card strategy with RevoCred.">
  <meta name="twitter:image" content="https://app.revocred.com/icons/Icon-512.png">

  <!-- Mobile & iOS PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RevoCred">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>RevoCred | Card Strategy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light dark;
      --rc-canvas: #f5f5f3;
      --rc-ink: #15141a;
      --rc-muted: #6a6672;
      --rc-track: #e2dfe5;
      --rc-accent: #6648d8;
      --rc-accent-ink: #ffffff;
      --rc-danger: #ca2953;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --rc-canvas: #0d0c11;
        --rc-ink: #f4f1f8;
        --rc-muted: #a9a2b3;
        --rc-track: #383240;
        --rc-accent: #a78bfa;
        --rc-accent-ink: #17121f;
        --rc-danger: #ff7296;
      }
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--rc-canvas);
      color: var(--rc-ink);
    }

    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      color: var(--rc-ink);
      background: var(--rc-canvas);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .app-loader__mark {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 3px solid var(--rc-track);
      border-top-color: var(--rc-accent);
      border-radius: 50%;
      animation: app-loader-spin 800ms linear infinite;
    }

    .app-loader__title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .app-loader__message {
      max-width: 360px;
      margin: 0;
      color: var(--rc-muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .app-loader__retry {
      display: none;
      margin: 20px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 12px;
      color: var(--rc-accent-ink);
      background: var(--rc-accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .app-loader--failed .app-loader__mark {
      animation: none;
      border-color: var(--rc-danger);
    }

    .app-loader--failed .app-loader__retry {
      display: block;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loader__mark { animation-duration: 1600ms; }
    }

    #rc-safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      visibility: hidden;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="rc-safe-area-probe" aria-hidden="true"></div>
  <main id="app-loader" class="app-loader" role="status" aria-live="polite">
    <div>
      <div class="app-loader__mark" aria-hidden="true"></div>
      <h1 class="app-loader__title">Opening RevoCred</h1>
      <p id="app-loader-message" class="app-loader__message">Preparing your card strategy workspace...</p>
      <button class="app-loader__retry" type="button" onclick="window.location.reload()">Reload RevoCred</button>
    </div>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
