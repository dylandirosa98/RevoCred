<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RevoCred credit-card strategy and rewards planning.">
  <meta name="theme-color" content="#F7F8FC">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RevoCred">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RevoCred | Card Strategy</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f7f8fc;
    }

    .app-loader {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #101828;
      background: #f7f8fc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .app-loader__mark {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 3px solid #d9ddef;
      border-top-color: #5b5ce2;
      border-radius: 50%;
      animation: app-loader-spin 800ms linear infinite;
    }

    .app-loader__title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .app-loader__message {
      max-width: 360px;
      margin: 0;
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .app-loader__retry {
      display: none;
      margin: 20px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #5b5ce2;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .app-loader--failed .app-loader__mark {
      animation: none;
      border-color: #d92d20;
    }

    .app-loader--failed .app-loader__retry {
      display: block;
    }

    @keyframes app-loader-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-loader__mark { animation-duration: 1600ms; }
    }
  </style>
</head>
<body>
  <main id="app-loader" class="app-loader" role="status" aria-live="polite">
    <div>
      <div class="app-loader__mark" aria-hidden="true"></div>
      <h1 class="app-loader__title">Opening RevoCred</h1>
      <p id="app-loader-message" class="app-loader__message">Preparing your card strategy workspace...</p>
      <button class="app-loader__retry" type="button" onclick="window.location.reload()">Reload preview</button>
    </div>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
