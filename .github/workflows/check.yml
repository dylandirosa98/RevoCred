name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: revocred-api/go.mod
          cache-dependency-path: revocred-api/go.sum
      - uses: actions/checkout@v4
        with:
          repository: flutter/flutter
          ref: 6b182d2c7585eba26d4edce0f97630effd256c33
          path: .flutter-sdk
      - run: echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
        working-directory: revocred_flutter
      - run: make check FLUTTER=flutter DART=dart
      - run: make database-test
      - run: go test -race ./...
        working-directory: revocred-api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: revocred-api
      - run: flutter build web --release --no-web-resources-cdn --dart-define=REVOCRED_USE_MOCKS=true
        working-directory: revocred_flutter
      - run: docker build -t revocred-api:ci revocred-api
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
